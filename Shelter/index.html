<!DOCTYPE html>
<html lang='en'>

  <head>
    <meta charset='UTF-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shelter</title>
    <link rel='stylesheet' href='style.css'>
    <script src="scripts.js" defer></script>
  </head>
  <body>
    
    <!-- Голова --> 
    <header></header>

    <!-- Основное тело -->
    <main></main>

    <!-- Низ -->
    <footer>
      <div class="footer-content">

        <!-- Блок с контактами -->
        <div class="footer-contacts">
          <div class="footer-contacts-title">
            <h3>For questions and suggestions</h3>
          </div>

          <!-- Почта -->
          <div class="footer-contacts-mail">
            <div class="footer-contacts-img">
              <img src="img/icon-email.svg" alt="">
            </div>
            <div class="footer-contacts-text">
              <h4>
                email@shelter.com
              </h4>
            </div>
          </div>

          <!-- Телефон -->
          <div class="footer-contacts-phone">
            <div class="footer-contacts-img">
              <img src="img/icon-phone.svg" alt="">
            </div>
            <div class="footer-contacts-text">
              <h4>
                +13 674 567 75 54
              </h4>
            </div>
          </div>
        </div>
        
        <!-- Блок с локацией -->
        <div class="footer-locations">
          <div>
            <h3>We are waiting for your visit</h3>
          </div>
          
          <!-- Бостон -->
          <div class="footer-locations-boston">
            <div class="footer-locations-img">
              <img src="img/icon-marker.svg" alt="">
            </div>
            <div class="footer-locations-text">
              <h4>
                1 Central Street, Boston <br> (entrance from the store)
              </h4>
            </div>
          </div>
          
          <!-- Лондон -->
          <div class="footer-locations-london">
            <div class="footer-locations-img">
              <img src="img/icon-marker.svg" alt="">
            </div>
            <div class="footer-locations-text">
              <h4>
                18 South Park, London
              </h4>
            </div>
          </div>
        </div>
        
        <!-- Картинка собачки -->
        <img src="img/footer-puppy.svg" alt="">
      </div>
    </footer>
    
  </body>
</html>
