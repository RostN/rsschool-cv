<!DOCTYPE html>
<html lang='en'>

  <head>
    <meta charset='UTF-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Podcast player</title>
    <link rel='stylesheet' href='style.css'>
    <script src="scripts.js" defer></script>
  </head>
  <body>
    
    <!-- Голова --> 
    <header>
      <div class="back"><</div>
      <div class="search">
        <input type="text" placeholder="Enter your search query">
        <img src="img/search.svg" alt="" class="headerImg">
      </div>
    </header>

    <!-- Основное тело -->
    <main>
      <div class="main-content">
<!-- 
        <div class="carts">
          <div class="cart-img">
            <img src="https://cdn-images-3.listennotes.com/podcasts/the-ed-mylett-show-ed-mylett-cumulus-vQDCWVsEFw2-PEUIT9RBhZD.300x300.jpg" alt="">
          </div>
          <div class="title">Title</div> 
          <div class="title2">Title2</div>
        </div> -->

      </div>

      <!-- Модальное окно -->
      <dialog id="dialog">

        <!-- Контент модального окна -->
        <div class="modalContent">
          <div class="modalImg"></div>
          <div class="modatText">
            <div class="modatTextAuthor"></div>
            <div class="modalTextName"></div>
            <div class="modatTextDescription"></div>
          </div>
        </div>
        
        <!-- Кнопка закрыть окно -->
        <div class="btnCloseModal">
          <svg class = "btnCloseImg" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" viewBox="0 0 612 612" xml:space="preserve">

            </path>
          </svg>
        </div>
        
      </dialog>
      
      <div class="audioPlayer">
        <audio id="audio" controls></audio>
      </div>
    </main>

    <!-- Низ -->
    <footer>
      <!-- Мой Гитхаб -->
      <a href="https://github.com/RostN" target="_blank" class="svgText">

      <!-- Логотип школы -->

</html>
